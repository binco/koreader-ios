name: Build KOReader iOS IPA

on:
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: macos-14 # 使用 GitHub 免费的 Apple Silicon macOS 运行环境

    steps:
      - name: Checkout repository (with submodules and tags)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          XCODE_16_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_16_PATH" ]; then
            echo "Switching to: $XCODE_16_PATH"
            sudo xcode-select -s "$XCODE_16_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Setup Homebrew dependencies and GNU toolchain
        run: |
          brew install autoconf automake libtool pkg-config nasm make coreutils gnu-tar wget curl cmake ninja meson python@3.12 gettext bison flex gawk git-lfs flock xcodegen findutils gnu-getopt util-linux sdl3
          
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix gawk)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix gnu-getopt)/bin" >> $GITHUB_PATH

      - name: Build macOS base toolchain
        run: |
          make TARGET=macos base

      - name: Generate Xcode project
        run: |
          make TARGET=ios xcodeproj

      - name: Ensure Info.plist exists
        run: |
          mkdir -p platform/ios
          if [ ! -f "platform/ios/Info.plist" ]; then
            echo "Generating fallback platform/ios/Info.plist..."
            cat << 'EOF' > platform/ios/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>KOReader</string>
              <key>CFBundleExecutable</key>
              <string>KOReader</string>
              <key>CFBundleIdentifier</key>
              <string>org.koreader.koreader</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>KOReader</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <false/>
              <key>UIStatusBarHidden</key>
              <true/>
          </dict>
          </plist>
          EOF
          fi

      - name: Build iOS App with Xcode
        run: |
          xcodebuild -project KOReader.xcodeproj \
            -scheme KOReader \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          # 寻找构建出来的 KOReader.app
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "KOReader.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/ -name "*.app" -maxdepth 4 | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r KOReader.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KOReader-iOS-IPA
          path: KOReader.ipa
          retention-days: 7
