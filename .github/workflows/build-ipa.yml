name: Build KOReader iOS IPA

on:
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: macos-14 # 使用 GitHub 免费的 Apple Silicon macOS 运行环境

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Homebrew dependencies and GNU Make
        run: |
          brew install autoconf automake libtool pkg-config nasm make
          # 将新版 GNU Make 路径注入系统环境变量，替换苹果过时的 3.81 版本
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Verify Make version
        run: |
          make --version

      - name: Build macOS base toolchain
        run: |
          make TARGET=macos base

      - name: Generate Xcode project
        run: |
          make TARGET=ios xcodeproj

      - name: Build iOS App with Xcode
        run: |
          xcodebuild -project KOReader.xcodeproj \
            -scheme KOReader \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          # 寻找构建出来的 KOReader.app 并打包
          APP_PATH=$(find build/Release-iphoneos/ -name "*.app" -maxdepth 2 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "KOReader.app" | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r KOReader.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KOReader-iOS-IPA
          path: KOReader.ipa
          retention-days: 7
